## 前言

中国改革开放四十余年，第一代企业家们凭借胆识与勤奋，缔造了数以百万计的家族企业。如今，这些企业正面临一个不可回避的命题——**传承**。

## 五大核心挑战

### 1. 创始人依赖综合征

> "企业就是我的孩子，谁也不如我了解它。"

这是无数创始人内心的真实写照。当企业运转高度依赖创始人个人关系网络、决策直觉和行业经验时，交接便成为最大的风险。

- 仅有 **23%** 的家族企业制定了正式的传承计划
- 约 **40%** 的企业在传承后五年内出现业绩下滑

### 2. 代际价值观冲突

两代人成长环境截然不同：

| 维度 | 第一代 | 第二代 |
|------|--------|--------|
| 管理风格 | 经验驱动、权威式 | 数据驱动、扁平化 |

| 技术认知 | 传统为主 | 数字化原生 |

### 3. 人才断层与信任缺失

传承与转型叠加，第二代不仅要接管企业，还需带领企业完成数字化甚至智能化转型。

1. **ChatGPT阶段**：把它当搜索引擎和文案助手

## 什么是AI Agent？

                                ${article.tags.map(tag => `<button class="tag" onclick="event.stopPropagation(); navigate('tag', '${tag}')">${tag}</button>`).join('')}
                            </div>
                        </div>
                        <div class="article-body">${htmlContent}</div>
                    </article>
                </div>
            </div>
        `;
    }

    function renderTagsPage() {
        const allTags = getAllTags();
        return `
            <div class="main-content" style="grid-template-columns: 1fr;">
                <div>
                    <div class="tags-page-header">
                        <h1>🏷️ 全部标签</h1>
                        <p style="color: var(--color-text-secondary);">共 ${allTags.length} 个标签，${articles.length} 篇文章</p>
                    </div>
                    <div class="tags-grid">
                        ${allTags.map(tag => {
                            const count = articles.filter(a => a.tags.includes(tag)).length;
                            return `<button class="tag" onclick="navigate('tag', '${tag}')" style="font-size: ${0.85 + count * 0.05}rem; padding: ${8 + count * 2}px ${16 + count * 4}px;">${tag}<span class="tag-count">${count}</span></button>`;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function getAllTags() {
        const tagMap = {};
        articles.forEach(a => {
            a.tags.forEach(t => {
                if (!tagMap[t]) tagMap[t] = 0;
                tagMap[t]++;
            });
        });
        return Object.entries(tagMap).sort((a, b) => b[1] - a[1]).map(e => e[0]);
    }
